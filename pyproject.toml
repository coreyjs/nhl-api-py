[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "nhl-api-py"
version = "3.7.1"
description = "Python wrapper for the NHL API: stats, schedules, standings, teams, players, game center, NHL EDGE tracking, and records. Hockey data for fans, analytics, and machine learning."
authors = [{ name = "Corey Schaf", email = "cschaf@gmail.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.23"]
keywords = [
    # fans
    "nhl", "hockey", "ice-hockey", "nhl-api", "nhl-stats", "nhl-schedule", "nhl-standings",
    # data / analytics
    "nhl-edge", "player-tracking", "hockey-analytics", "sports-analytics", "sports-data", "statistics",
    # ML / AI
    "data-science", "machine-learning",
    # developers
    "sports", "api-wrapper", "api-client",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/coreyjs/nhl-api-py"
Repository = "https://github.com/coreyjs/nhl-api-py"
Documentation = "https://github.com/coreyjs/nhl-api-py/tree/main/docs"
Issues = "https://github.com/coreyjs/nhl-api-py/issues"
Changelog = "https://github.com/coreyjs/nhl-api-py/releases"
Funding = "https://buymeacoffee.com/coreyjs"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "nhlpy" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
mypy = "*"
ruff = "*"
black = ">=26.3.1"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff]
line-length = 121

[tool.black]
line-length = 121
